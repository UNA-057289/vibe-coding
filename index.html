<!DOCTYPE html>
<!-- 「今日热搜」项目 · Day 2 占位首页｜功能将在 Day 7 开始开发 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日热搜</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #1f2329;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 52px 56px;
      text-align: center;
      max-width: 560px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      color: #0b63c6;
      background: #eaf2fd;
      border-radius: 999px;
      padding: 5px 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .lead {
      font-size: 15px;
      color: #5b6270;
      line-height: 1.9;
    }

    .meta {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #eef0f3;
      font-size: 13px;
      color: #98a0ad;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Day 2 · 占位首页</span>
    <h1>今日热搜</h1>
    <p class="lead">
      这是项目的第一张网页，用来验证环境和 Git 流程是否通畅。<br>
      热搜榜单功能将在 Day 7 开始开发。
    </p>
    <p class="meta">vibe-coding · 第一天入库的网页</p>
  </main>
</body>
</html>
